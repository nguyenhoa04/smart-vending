<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">Luồng lệnh điều khiển</title>
  <desc id="desc">Raspberry Pi gửi lệnh qua UART tới command service, sau đó lệnh được điều phối tới shelf service hoặc door session service và trả sự kiện về Pi.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
    <style>
      .title{font:700 25px 'Segoe UI',Arial,sans-serif;fill:#0f172a}.group{fill:#f8fafc;stroke:#94a3b8;stroke-width:2;rx:18}
      .group-title{font:700 16px 'Segoe UI',Arial,sans-serif;fill:#334155}.node{stroke-width:2;rx:12}
      .external{fill:#fff7ed;stroke:#ea580c}.driver{fill:#ecfeff;stroke:#0891b2}.service{fill:#f0fdf4;stroke:#16a34a}.hardware{fill:#eff6ff;stroke:#2563eb}
      .label{font:600 16px 'Segoe UI',Arial,sans-serif;fill:#0f172a;text-anchor:middle}.sub{font:400 13px 'Segoe UI',Arial,sans-serif;fill:#475569;text-anchor:middle}
      .edge{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#arrow)}.return{stroke:#7c3aed;stroke-width:2;fill:none;stroke-dasharray:7 5;marker-end:url(#arrow)}
      .edge-label{font:500 13px 'Segoe UI',Arial,sans-serif;fill:#475569;text-anchor:middle}
    </style>
  </defs>
  <rect width="1280" height="680" fill="#ffffff"/>
  <text class="title" x="640" y="38" text-anchor="middle">Luồng lệnh điều khiển và phản hồi</text>

  <rect class="group" x="270" y="66" width="960" height="556"/>
  <text class="group-title" x="294" y="96">ESP32 firmware</text>

  <rect class="node external" x="30" y="265" width="180" height="90"/>
  <text class="label" x="120" y="300">Raspberry Pi</text><text class="sub" x="120" y="326">Command / event</text>

  <rect class="node driver" x="320" y="265" width="170" height="90"/>
  <text class="label" x="405" y="300">pi_uart</text><text class="sub" x="405" y="326">UART1</text>
  <rect class="node service" x="555" y="265" width="190" height="90"/>
  <text class="label" x="650" y="300">command_service</text><text class="sub" x="650" y="326">Parse và dispatch</text>

  <rect class="node service" x="835" y="135" width="210" height="90"/>
  <text class="label" x="940" y="170">shelf_service</text><text class="sub" x="940" y="196">Cân và calibration</text>
  <rect class="node service" x="835" y="395" width="210" height="90"/>
  <text class="label" x="940" y="430">door_session_service</text><text class="sub" x="940" y="456">Cửa, khóa, session</text>

  <rect class="node driver" x="1090" y="135" width="110" height="90"/>
  <text class="label" x="1145" y="170">hx711</text><text class="sub" x="1145" y="196">Driver</text>
  <rect class="node driver" x="1090" y="395" width="110" height="90"/>
  <text class="label" x="1145" y="430">lock</text><text class="sub" x="1145" y="456">GPIO</text>

  <rect class="node hardware" x="1065" y="535" width="150" height="60"/>
  <text class="label" x="1140" y="570">Relay + MC-38</text>
  <rect class="node hardware" x="1065" y="60" width="150" height="60"/>
  <text class="label" x="1140" y="88">HX711 +</text><text class="sub" x="1140" y="108">Load cell</text>

  <path class="edge" d="M210 295 H313"/><text class="edge-label" x="260" y="282">UART command</text>
  <path class="edge" d="M490 310 H548"/>
  <path class="edge" d="M745 290 C790 270 800 180 828 180"/><text class="edge-label" x="790" y="230">TARE / CALIBRATE</text>
  <path class="edge" d="M745 330 C790 350 800 440 828 440"/><text class="edge-label" x="790" y="392">UNLOCK / STATUS</text>
  <path class="edge" d="M1045 180 H1083"/>
  <path class="edge" d="M1145 135 V127"/>
  <path class="edge" d="M1045 440 H1083"/>
  <path class="edge" d="M1145 485 V528"/>

  <path class="return" d="M835 205 C765 215 790 375 745 345"/>
  <path class="return" d="M835 465 C770 475 790 365 745 350"/>
  <path class="return" d="M555 345 C515 405 340 405 320 350"/>
  <path class="return" d="M320 335 C275 410 155 410 120 362"/>
  <text class="edge-label" x="465" y="420">Weight / trạng thái / sự kiện</text>
</svg>
